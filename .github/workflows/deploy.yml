name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || '200.141.13.198' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          passphrase: ${{ secrets.HOSTINGER_PASSPHRASE }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || '22' }}
          timeout: 120s
          command_timeout: 25m
          script: |
            echo "🚀 Executing automated Hostinger VPS Deployment Script for branch ${{ github.ref_name }}..."
            curl -sSL https://raw.githubusercontent.com/cambliss/office-connect-full-product/${{ github.ref_name }}/deploy-hostinger.sh | bash -s -- "${{ github.ref_name }}"

